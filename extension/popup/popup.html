<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask Claude</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-arrow-up" viewBox="0 0 16 16"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></symbol>
    <symbol id="i-external" viewBox="0 0 16 16"><path d="M9 3h4v4M13 3 7.5 8.5M11.5 9.5V12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5.5a1 1 0 0 1 1-1h2.5"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 16 16"><path d="M2.5 4.5h6M11.5 4.5h2M2.5 11.5h2M7.5 11.5h6"/><circle cx="10" cy="4.5" r="1.5"/><circle cx="6" cy="11.5" r="1.5"/></symbol>
    <symbol id="i-page" viewBox="0 0 16 16"><path d="M4 1.8h5.2L12.5 5v9.2H4z"/><path d="M9 1.8V5h3.5M6 8h4.5M6 10.5h4.5"/></symbol>
    <symbol id="i-cursor" viewBox="0 0 16 16"><path d="M6 2.5h4M6 13.5h4M8 2.5v11"/></symbol>
    <symbol id="i-list" viewBox="0 0 16 16"><path d="M6 4h7.5M6 8h7.5M6 12h7.5"/><circle cx="2.8" cy="4" r=".6"/><circle cx="2.8" cy="8" r=".6"/><circle cx="2.8" cy="12" r=".6"/></symbol>
    <symbol id="i-bulb" viewBox="0 0 16 16"><path d="M6 12.5h4M6.5 14.5h3M5.2 10.2A4.5 4.5 0 1 1 10.8 10.2c-.5.4-.8 1-.8 1.6v.2H6v-.2c0-.6-.3-1.2-.8-1.6z"/></symbol>
    <symbol id="i-flag" viewBox="0 0 16 16"><path d="M3.5 14.5V2M3.5 2.5h8l-1.8 3 1.8 3h-8"/></symbol>
    <symbol id="i-pen" viewBox="0 0 16 16"><path d="M10.5 2.5l3 3-8 8H2.5v-3z"/><path d="M9 4l3 3"/></symbol>
  </svg>

  <header class="bar">
    <div class="brand">
      <img src="../icons/toolbar-32.png" width="18" height="18" alt="">
      <span>Claude</span>
    </div>
    <div class="bar-actions">
      <button type="button" class="text-button" id="open-claude" title="Open a new chat on claude.ai">
        New chat
        <svg class="icon"><use href="#i-external"/></svg>
      </button>
      <button type="button" class="icon-button" id="open-settings" title="Settings" aria-label="Settings">
        <svg class="icon"><use href="#i-sliders"/></svg>
      </button>
    </div>
  </header>

  <div class="banner" id="access-banner" hidden>
    <span>Allow the extension on claude.ai so it can fill in your prompt.</span>
    <button type="button" id="grant-access">Allow</button>
  </div>

  <form class="composer" id="ask-form">
    <label class="visually-hidden" for="prompt">Message to Claude</label>
    <textarea id="prompt" rows="3" placeholder="Ask Claude anything…" autofocus></textarea>
    <div class="composer-row">
      <div class="chips">
        <label class="chip" id="page-chip">
          <input type="checkbox" id="include-page">
          <svg class="icon"><use href="#i-page"/></svg>
          <span id="page-label">This page</span>
        </label>
        <label class="chip" id="selection-chip" hidden>
          <input type="checkbox" id="include-selection">
          <svg class="icon"><use href="#i-cursor"/></svg>
          <span id="selection-label">Selection</span>
        </label>
      </div>
      <button type="submit" class="send" id="send" aria-label="Send to Claude" disabled>
        <svg class="icon"><use href="#i-arrow-up"/></svg>
      </button>
    </div>
  </form>

  <section class="actions" aria-label="Quick actions">
    <button type="button" data-action="summarize">
      <svg class="icon"><use href="#i-list"/></svg>Summarize page
    </button>
    <button type="button" data-action="takeaways">
      <svg class="icon"><use href="#i-flag"/></svg>Key takeaways
    </button>
    <button type="button" data-action="explain">
      <svg class="icon"><use href="#i-bulb"/></svg>Explain selection
    </button>
    <button type="button" data-action="rewrite">
      <svg class="icon"><use href="#i-pen"/></svg>Improve writing
    </button>
  </section>

  <footer class="foot">
    <label class="switch">
      <input type="checkbox" id="auto-send">
      <span>Send automatically</span>
    </label>
    <span class="hint"><kbd>⏎</kbd> send · <kbd>⇧⏎</kbd> new line</span>
  </footer>

  <script src="../shared/common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
